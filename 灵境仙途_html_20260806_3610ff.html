<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>灵境仙途 · 星级合成·小境界提升</title>
    <style>
        /* ===== 全局样式（完整，与之前相同） ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: linear-gradient(145deg, #e8f0e6 0%, #d4e0d0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .game-wrap {
            max-width: 560px;
            width: 100%;
            background: rgba(255, 250, 240, 0.6);
            backdrop-filter: blur(16px);
            border-radius: 48px;
            padding: 20px 18px 26px;
            box-shadow: 0 30px 60px rgba(60, 80, 50, 0.15), 0 0 0 1px rgba(200, 220, 180, 0.5) inset;
            border: 1px solid rgba(255, 255, 240, 0.7);
            position: relative;
            overflow: hidden;
        }
        .bg-leaf {
            position: absolute;
            border-radius: 50%;
            background: rgba(160, 200, 140, 0.1);
            pointer-events: none;
            filter: blur(40px);
        }
        .leaf-1 {
            width: 200px;
            height: 200px;
            top: -60px;
            right: -40px;
        }
        .leaf-2 {
            width: 160px;
            height: 160px;
            bottom: -30px;
            left: -30px;
        }

        /* ===== 导航标签 ===== */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 18px;
            position: relative;
            z-index: 2;
            background: rgba(220, 240, 210, 0.3);
            padding: 6px;
            border-radius: 40px;
            border: 1px solid rgba(160, 200, 150, 0.2);
            flex-wrap: wrap;
        }
        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 8px 0;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            color: #4d6a4d;
            cursor: pointer;
            transition: 0.2s;
            letter-spacing: 0.3px;
            min-width: 44px;
        }
        .tab-btn.active {
            background: rgba(255, 255, 240, 0.7);
            box-shadow: 0 4px 12px rgba(80, 140, 70, 0.1);
            color: #2d4a2d;
        }
        .tab-btn:active {
            transform: scale(0.95);
        }

        /* ===== 面板通用 ===== */
        .panel {
            display: none;
            animation: fadeSlide 0.3s ease;
        }
        .panel.active {
            display: block;
        }
        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== 修行面板 ===== */
        .header {
            text-align: center;
            margin-bottom: 14px;
        }
        .realm-name {
            font-size: 28px;
            font-weight: 700;
            color: #3a5a3a;
            text-shadow: 0 2px 12px rgba(80, 140, 80, 0.15);
            letter-spacing: 2px;
        }
        .realm-name .sub {
            font-size: 14px;
            font-weight: 400;
            color: #6a8a6a;
        }
        .progress-wrap {
            background: rgba(180, 210, 170, 0.3);
            border-radius: 30px;
            height: 14px;
            margin: 10px 4px 8px;
            overflow: hidden;
            border: 1px solid rgba(140, 180, 130, 0.2);
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #8fc98a, #5fa85a);
            border-radius: 30px;
            transition: width 0.4s;
            box-shadow: 0 0 16px rgba(80, 180, 80, 0.2);
        }
        .stats-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #4d6a4d;
            font-weight: 500;
            padding: 0 4px;
            flex-wrap: wrap;
            gap: 4px;
        }
        .stats-row span {
            background: rgba(220, 240, 210, 0.4);
            padding: 2px 14px;
            border-radius: 30px;
            border: 1px solid rgba(160, 200, 150, 0.2);
        }
        .cultivate-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 12px 0 16px;
        }
        .cultivate-btn {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #e2f0d8, #b8d8aa);
            border: none;
            box-shadow: 0 16px 40px rgba(80, 140, 70, 0.2), 0 4px 12px rgba(0, 0, 0, 0.05), 0 0 0 4px rgba(180, 220, 160, 0.4) inset;
            cursor: pointer;
            transition: all 0.12s;
            font-size: 18px;
            font-weight: 600;
            color: #2d4a2d;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1.3;
            position: relative;
            touch-action: manipulation;
        }
        .cultivate-btn:active {
            transform: scale(0.92);
            box-shadow: 0 8px 20px rgba(80, 140, 70, 0.3), 0 0 0 4px rgba(160, 210, 140, 0.6) inset;
        }
        .cultivate-btn .icon {
            font-size: 46px;
            line-height: 1;
            margin-bottom: 2px;
            filter: drop-shadow(0 4px 8px rgba(80, 140, 70, 0.2));
        }
        .cultivate-btn .sub {
            font-size: 14px;
            font-weight: 400;
            color: #3d5a3d;
            background: rgba(255, 255, 240, 0.4);
            padding: 2px 18px;
            border-radius: 30px;
            backdrop-filter: blur(2px);
        }
        .resource-row {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 12px;
            font-size: 14px;
            color: #3d5a3d;
            font-weight: 500;
            background: rgba(220, 240, 210, 0.3);
            padding: 6px 16px;
            border-radius: 40px;
            border: 1px solid rgba(160, 200, 150, 0.2);
            flex-wrap: wrap;
        }
        .resource-row span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ===== 渡劫区域 ===== */
        .breakthrough-area {
            margin: 14px 0 10px;
            padding: 14px 16px;
            background: rgba(255, 235, 200, 0.4);
            border-radius: 30px;
            border: 2px solid #f5b86e;
            text-align: center;
        }
        .breakthrough-area .title {
            font-weight: 700;
            font-size: 18px;
            color: #7a5a2a;
        }
        .breakthrough-area .requirements {
            font-size: 14px;
            color: #5a4a2a;
            margin: 6px 0 10px;
        }
        .breakthrough-area .btn-breakthrough {
            background: #f5b86e;
            border: none;
            border-radius: 40px;
            padding: 8px 20px;
            font-size: 16px;
            font-weight: 700;
            color: #3d2a1a;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 4px 12px rgba(200, 150, 70, 0.2);
            margin: 4px;
        }
        .breakthrough-area .btn-breakthrough:active {
            transform: scale(0.95);
        }
        .breakthrough-area .btn-breakthrough:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .breakthrough-area .btn-forced {
            background: #d45a5a;
            color: #fff;
            box-shadow: 0 4px 12px rgba(200, 50, 50, 0.2);
        }
        .breakthrough-area .btn-forced:disabled {
            background: #a0a0a0;
        }
        .breakthrough-area .btn-extreme {
            background: #b8860b;
            color: #fff;
            box-shadow: 0 4px 12px rgba(184, 134, 11, 0.3);
        }
        .breakthrough-area .btn-extreme:disabled {
            background: #a0a0a0;
        }

        /* ===== 功法面板 ===== */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 6px;
        }
        .skill-card {
            background: rgba(240, 248, 235, 0.5);
            backdrop-filter: blur(4px);
            border-radius: 20px;
            padding: 10px 12px;
            border: 1px solid rgba(180, 210, 170, 0.25);
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
        }
        .skill-card.unlocked {
            background: rgba(230, 245, 225, 0.7);
            border-color: #8ab87a;
        }
        .skill-card .skill-name {
            font-weight: 600;
            font-size: 14px;
            color: #2d4a2d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .skill-card .skill-name .badge {
            font-size: 11px;
            background: #d4e8cc;
            padding: 1px 10px;
            border-radius: 30px;
            color: #3d5a3d;
            font-weight: 500;
        }
        .skill-card .skill-desc {
            font-size: 12px;
            color: #5a7a5a;
            margin: 3px 0 6px;
            line-height: 1.3;
        }
        .skill-card .skill-stats {
            font-size: 11px;
            color: #4a7a4a;
            margin-bottom: 4px;
        }
        .skill-card .btn-unlock {
            margin-top: 4px;
            background: #d4e8cc;
            border: none;
            border-radius: 30px;
            padding: 4px 0;
            font-size: 13px;
            font-weight: 600;
            color: #2d4a2d;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid rgba(160, 200, 150, 0.2);
        }
        .skill-card .btn-unlock:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== 地图面板 ===== */
        .map-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .map-header h2 {
            font-size: 20px;
            color: #3a5a3a;
        }
        .map-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(220, 240, 210, 0.3);
            padding: 4px 12px 4px 16px;
            border-radius: 30px;
            border: 1px solid rgba(160, 200, 150, 0.2);
        }
        .map-selector select {
            background: transparent;
            border: none;
            font-size: 14px;
            font-weight: 600;
            color: #2d4a2d;
            padding: 6px 4px;
            outline: none;
            cursor: pointer;
        }
        .map-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .region-card {
            background: rgba(240, 248, 235, 0.5);
            backdrop-filter: blur(4px);
            border-radius: 20px;
            padding: 14px 12px;
            border: 1px solid rgba(180, 210, 170, 0.25);
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }
        .region-card:active {
            transform: scale(0.95);
        }
        .region-card.active {
            border-color: #8ab87a;
            background: rgba(230, 245, 225, 0.7);
        }
        .region-card.locked {
            opacity: 0.5;
            filter: grayscale(0.6);
            cursor: not-allowed;
        }
        .region-card .region-icon {
            font-size: 32px;
            display: block;
            margin-bottom: 4px;
        }
        .region-card .region-name {
            font-weight: 600;
            color: #2d4a2d;
            font-size: 16px;
        }
        .region-card .region-info {
            font-size: 12px;
            color: #5a7a5a;
            margin-top: 2px;
        }
        .region-card .region-drop {
            font-size: 11px;
            color: #7a9a6a;
            margin-top: 2px;
        }
        .region-card .region-requirement {
            font-size: 10px;
            color: #b33a3a;
            margin-top: 2px;
        }
        .region-card .region-boss {
            font-size: 11px;
            color: #b33a3a;
            margin-top: 2px;
            background: rgba(255, 200, 200, 0.3);
            border-radius: 30px;
            padding: 2px 8px;
            display: inline-block;
        }

        /* ===== 探索日志/战斗 ===== */
        .explore-area {
            margin-top: 14px;
            background: rgba(220, 240, 210, 0.2);
            border-radius: 20px;
            padding: 12px 16px;
            border: 1px solid rgba(160, 200, 150, 0.15);
            max-height: 200px;
            overflow-y: auto;
        }
        .explore-area .log-entry {
            font-size: 13px;
            color: #3d5a3d;
            padding: 4px 0;
            border-bottom: 1px solid rgba(160, 200, 150, 0.1);
        }
        .explore-area .log-entry .time {
            color: #8a9a7a;
            font-size: 11px;
            margin-right: 6px;
        }
        .explore-btn {
            width: 100%;
            padding: 10px;
            background: #b8d8aa;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            color: #1f3a1f;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.15s;
            box-shadow: 0 4px 12px rgba(80, 140, 70, 0.1);
        }
        .explore-btn:active {
            transform: scale(0.96);
        }
        .explore-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .boss-btn {
            background: #f5b86e !important;
        }
        .boss-btn:active {
            transform: scale(0.96);
        }
        .boss-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== 装备面板 ===== */
        .equip-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-top: 8px;
        }
        .equip-slot {
            background: rgba(240, 248, 235, 0.5);
            border-radius: 20px;
            padding: 12px 10px;
            border: 2px dashed rgba(160, 200, 150, 0.3);
            text-align: center;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: 0.2s;
        }
        .equip-slot .slot-label {
            font-size: 12px;
            color: #7a9a7a;
            font-weight: 500;
        }
        .equip-slot .equip-name {
            font-weight: 600;
            color: #2d4a2d;
            font-size: 14px;
            margin-top: 2px;
        }
        .equip-slot .equip-stats {
            font-size: 12px;
            color: #5a7a5a;
        }
        .equip-slot.has-equip {
            border-color: #8ab87a;
            background: rgba(230, 245, 225, 0.6);
        }
        .equip-slot .unequip-btn {
            margin-top: 6px;
            background: #f5e6d0;
            border: none;
            border-radius: 30px;
            padding: 2px 14px;
            font-size: 12px;
            cursor: pointer;
            color: #5a3d2a;
        }
        .backpack-area {
            margin-top: 16px;
            background: rgba(220, 240, 210, 0.2);
            border-radius: 20px;
            padding: 12px 14px;
            border: 1px solid rgba(160, 200, 150, 0.15);
            max-height: 180px;
            overflow-y: auto;
        }
        .backpack-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 8px;
            border-bottom: 1px solid rgba(160, 200, 150, 0.1);
            font-size: 13px;
            flex-wrap: wrap;
            gap: 4px;
        }
        .backpack-item .item-name {
            font-weight: 500;
            color: #2d4a2d;
        }
        .backpack-item .item-stats {
            color: #5a7a5a;
            font-size: 12px;
        }
        .backpack-item .item-actions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .backpack-item .item-actions button {
            background: #b8d8aa;
            border: none;
            border-radius: 30px;
            padding: 2px 10px;
            font-size: 12px;
            cursor: pointer;
            color: #1f3a1f;
            transition: 0.1s;
        }
        .backpack-item .item-actions button:active {
            transform: scale(0.92);
        }
        .backpack-item .item-actions .btn-decompose {
            background: #f5d0c0;
            color: #6a3a2a;
        }
        .backpack-item .item-actions .btn-enhance {
            background: #c8d8f0;
            color: #1f3a5a;
        }
        .backpack-item .item-actions .btn-synthesize {
            background: #f5e6a0;
            color: #5a4a1a;
        }
        .backpack-item .item-count {
            font-size: 12px;
            color: #8a9a7a;
            background: rgba(0,0,0,0.04);
            padding: 0 8px;
            border-radius: 30px;
        }
        .equip-actions {
            margin-top: 12px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .equip-actions button {
            background: #d4e8cc;
            border: none;
            border-radius: 30px;
            padding: 6px 18px;
            font-size: 13px;
            font-weight: 600;
            color: #2d4a2d;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid rgba(160, 200, 150, 0.2);
        }
        .equip-actions button:active {
            transform: scale(0.95);
        }

        /* ===== 灵兽面板 ===== */
        .pet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .pet-header h2 {
            font-size: 20px;
            color: #3a5a3a;
        }
        .pet-section {
            margin-bottom: 20px;
            background: rgba(240, 248, 235, 0.3);
            border-radius: 24px;
            padding: 14px 16px;
            border: 1px solid rgba(180, 210, 170, 0.2);
        }
        .pet-section-title {
            font-weight: 700;
            font-size: 16px;
            color: #3a5a3a;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .pet-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .pet-card {
            background: rgba(255, 255, 240, 0.4);
            backdrop-filter: blur(4px);
            border-radius: 20px;
            padding: 12px 14px;
            border: 1px solid rgba(180, 210, 170, 0.25);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .pet-card .pet-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .pet-card .pet-name {
            font-weight: 700;
            font-size: 16px;
            color: #2d4a2d;
        }
        .pet-card .pet-stats {
            font-size: 13px;
            color: #5a7a5a;
        }
        .pet-card .pet-skills {
            font-size: 12px;
            color: #4a6a4a;
            background: rgba(200, 220, 180, 0.3);
            padding: 4px 10px;
            border-radius: 30px;
        }
        .pet-card .pet-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .pet-card .pet-actions button {
            background: #d4e8cc;
            border: none;
            border-radius: 30px;
            padding: 4px 14px;
            font-size: 13px;
            font-weight: 600;
            color: #2d4a2d;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid rgba(160, 200, 150, 0.2);
        }
        .pet-card .pet-actions button.active-mode {
            background: #f5b86e;
            color: #3d2a1a;
        }
        .pet-card .pet-actions button:active {
            transform: scale(0.95);
        }
        .pet-card .pet-actions .btn-advance-pet {
            background: #f5e6a0;
            color: #5a4a1a;
        }
        .pet-card .pet-actions .btn-decompose-pet {
            background: #f5d0c0;
            color: #6a3a2a;
        }
        .pet-card .pet-egg {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .pet-card .pet-egg .egg-info {
            font-size: 14px;
            color: #5a7a5a;
        }
        .pet-card .pet-egg .btn-hatch {
            background: #f5b86e;
            border: none;
            border-radius: 30px;
            padding: 4px 16px;
            font-size: 14px;
            font-weight: 600;
            color: #3d2a1a;
            cursor: pointer;
        }
        .pet-card .pet-egg .btn-hatch:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .pet-card .pet-egg .btn-decompose-egg {
            background: #f5d0c0;
            border: none;
            border-radius: 30px;
            padding: 4px 16px;
            font-size: 14px;
            font-weight: 600;
            color: #6a3a2a;
            cursor: pointer;
        }
        .material-area {
            margin-top: 16px;
            background: rgba(220, 240, 210, 0.2);
            border-radius: 20px;
            padding: 12px 14px;
            border: 1px solid rgba(160, 200, 150, 0.15);
        }
        .material-area .mat-item {
            display: inline-block;
            background: rgba(255,255,240,0.4);
            padding: 2px 12px;
            border-radius: 30px;
            margin: 3px;
            font-size: 13px;
            color: #3d5a3d;
        }

        /* ===== 法宝面板 ===== */
        .artifact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 8px;
        }
        .artifact-card {
            background: rgba(240, 248, 235, 0.5);
            backdrop-filter: blur(4px);
            border-radius: 20px;
            padding: 14px 12px;
            border: 1px solid rgba(180, 210, 170, 0.25);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .artifact-card .art-name {
            font-weight: 700;
            font-size: 16px;
            color: #2d4a2d;
        }
        .artifact-card .art-desc {
            font-size: 12px;
            color: #5a7a5a;
        }
        .artifact-card .art-skills {
            font-size: 12px;
            color: #4a6a4a;
            background: rgba(200, 220, 180, 0.3);
            padding: 2px 8px;
            border-radius: 30px;

                const subStart = start + subIdx * step;
                const subEnd = start + (subIdx + 1) * step;
                if (subIdx >= 4) return 1;
                return clamp((current - subStart) / (subEnd - subStart), 0, 1);
            }

            // ========== 属性计算（装备星级加成） ==========
            function getEquipStats(itemId, enhance = 0, star = 0) {
                const base = EQUIP_TEMPLATES.find(e => e.id === itemId);
                if (!base) return null;
                // 星级倍率：0星1倍，1星1.5倍，2星2倍，3星3倍
                const starMultiplier = star === 0 ? 1 : (1 + star * 0.5);
                let atk = Math.floor(base.attack * starMultiplier);
                let def = Math.floor(base.defense * starMultiplier);
                let hp = Math.floor(base.hp * starMultiplier);
                // 强化加成（保留原强化系统，但星级越高强化收益越明显）
                const bonus = enhance * 0.05;
                atk = Math.floor(atk * (1 + bonus));
                def = Math.floor(def * (1 + bonus));
                hp = Math.floor(hp * (1 + bonus));
                const nameSuffix = star === 0 ? '' : ` ★${star}`;
                return { attack: atk, defense: def, hp: hp, type: base.type, name: base.name + nameSuffix,
                    tier: base.tier, star: star, enhance: enhance };
            }

            function recalcPlayerStats() {
                let atk = state.baseAttack;
                let def = state.baseDefense;
                let maxHp = state.baseMaxHp;

                // 功法
                Object.keys(state.skillLevels).forEach(id => {
                    const skill = SKILLS.find(s => s.id === id);
                    if (!skill) return;
                    const level = state.skillLevels[id];
                    if (skill.effect.exponential) {
                        const multiplier = Math.pow(2, level - 1);
                        atk += skill.effect.attack * multiplier;
                        def += skill.effect.defense * multiplier;
                        maxHp += skill.effect.hp * multiplier;
                    } else {
                        atk += skill.effect.attack * level;
                        def += skill.effect.defense * level;
                        maxHp += skill.effect.hp * level;
                    }
                });

                // 装备
                for (const slot of ['weapon', 'armor', 'accessory']) {
                    const equip = state.equipment[slot];
                    if (equip) {
                        const stats = getEquipStats(equip.id, equip.enhance || 0, equip.star || 0);
                        if (stats) {
                            atk += stats.attack || 0;
                            def += stats.defense || 0;
                            maxHp += stats.hp || 0;
                        }
                    }
                }

                // 灵兽加持
                let blessAtk = 0,
                    blessDef = 0,
                    blessHp = 0;
                state.pets.forEach(p => {
                    if (p.mode === 'bless' && p.hp > 0) {
                        blessAtk += Math.floor(p.attack / 3);
                        blessDef += Math.floor(p.defense / 3);
                        blessHp += Math.floor(p.hp / 3);
                    }
                });
                atk += blessAtk;
                def += blessDef;
                maxHp += blessHp;

                // 极境效果（已永久提升）
                const oldMax = state.player.maxHp;
                state.player.maxHp = Math.max(10, maxHp);
                state.player.attack = atk;
                state.player.defense = def;
                if (oldMax > 0) {
                    state.player.hp = Math.min(state.player.maxHp, state.player.hp * state.player.maxHp / oldMax);
                } else {
                    state.player.hp = state.player.maxHp;
                }
                state.player.hp = Math.max(1, state.player.hp);
            }

            // ========== 特效 ==========
            function showFloatText(text, anchor) {

                const ripple = document.createElement('span');
                ripple.className = 'ripple';
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = (rect.width / 2 - size / 2) + 'px';
                ripple.style.top = (rect.height / 2 - size / 2) + 'px';
                btn.appendChild(ripple);
                setTimeout(() => ripple.remove(), 700);

            // ========== 突破属性提升（小境界） ==========
            function applySubRealmBonus(oldSub, newSub) {
                // 每提升一个小境界，攻击+1，防御+1，HP+5
                if (newSub > oldSub) {
                    const diff = newSub - oldSub;
                    state.baseAttack += diff * 1;
                    state.baseDefense += diff * 1;
                    state.baseMaxHp += diff * 5;

            }

                const next = getNextRealm();

                if (getSubIndex() === 3 && state.cultivation >= next.threshold) {
