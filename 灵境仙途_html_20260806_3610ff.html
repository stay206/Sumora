            function updateBreakthroughUI() {
                const next = getNextRealm();
                if (!next || !state.pendingBreakthrough) {
                    breakthroughArea.style.display = 'none';
                    return;
                }
                breakthroughArea.style.display = 'block';
                const req = next.requirements;
                if (!req) {
                    breakthroughRequirements.innerHTML = '已达圆满，可直接飞升！';
                    breakthroughBtn.disabled = false;
                    forcedBreakthroughBtn.disabled = true;
                    extremeBreakthroughBtn.disabled = true;
                    return;
                }
                const curAtk = state.player.attack;
                const curDef = state.player.defense;
                const curHp = state.player.maxHp;
                const atkOk = curAtk >= req.attack;
                const defOk = curDef >= req.defense;
                const hpOk = curHp >= req.hp;
                const allOk = atkOk && defOk && hpOk;

                let html =
                    `要求：攻击 ≥ ${req.attack} (${curAtk}) ${atkOk ? '✅' : '❌'}，`;
                html += `防御 ≥ ${req.defense} (${curDef}) ${defOk ? '✅' : '❌'}，`;
                html += `生命 ≥ ${req.hp} (${curHp}) ${hpOk ? '✅' : '❌'}`;
                breakthroughRequirements.innerHTML = html;

                breakthroughBtn.disabled = !allOk;
                breakthroughBtn.textContent = allOk ? '⚡ 突破大境界' : '属性不足，无法突破';

                const forcedUsed = state.forcedBreakthroughUsed[state.realmIndex] || false;
                if (forcedUsed || getIsExtreme()) {
                    forcedBreakthroughBtn.disabled = true;
                    forcedBreakthroughBtn.textContent = forcedUsed ? '已使用' : '不可用';
                } else {
                    forcedBreakthroughBtn.disabled = false;
                    forcedBreakthroughBtn.textContent = '💢 强行渡劫 (5%)';
                }

                if (getSubIndex() === 3 && !getIsExtreme() && getExtremeTriggered()) {
                    extremeBreakthroughBtn.disabled = false;
                    extremeBreakthroughBtn.textContent = '🌟 突破极境';
                } else {
                    extremeBreakthroughBtn.disabled = true;
                    if (getIsExtreme()) extremeBreakthroughBtn.textContent = '已突破极境';
                    else if (getExtremeTriggered()) extremeBreakthroughBtn.textContent = '条件满足，可突破';
                    else extremeBreakthroughBtn.textContent = '需触发极境 (1%战斗)';
                }
            }

            // 突破大境界（属性大幅提升）
            function attemptBreakthrough() {
                const next = getNextRealm();
                if (!next || !state.pendingBreakthrough) { alert('没有可突破的境界'); return; }
                const req = next.requirements;
                if (req) {
                    const curAtk = state.player.attack;
                    const curDef = state.player.defense;
                    const curHp = state.player.maxHp;
                    if (curAtk < req.attack || curDef < req.defense || curHp < req.hp) {
                        // 失败惩罚
                        state.baseAttack = Math.max(1, Math.floor(state.baseAttack * 5 / 6));
                        state.baseDefense = Math.max(1, Math.floor(state.baseDefense * 5 / 6));
                        state.baseMaxHp = Math.max(10, Math.floor(state.baseMaxHp * 5 / 6));
                        recalcPlayerStats();
                        const { start, step } = getSubThresholds();
                        const subStart = start + getSubIndex() * step;
                        state.cultivation = subStart;
                        showResult(false, '突破失败！修为退回小境界起始，全属性损失1/6。');
                        updateUI();
                        saveGame();
                        return;
                    }
                }
                // 成功：属性大幅提升
                const bonusAtk = 2 + state.realmIndex * 2;
                const bonusDef = 1 + state.realmIndex;
                const bonusHp = 10 + state.realmIndex * 5;
                state.baseAttack += bonusAtk;
                state.baseDefense += bonusDef;
                state.baseMaxHp += bonusHp;

                state.realmIndex++;
                state.progress[state.realmIndex] = { subIndex: 0, isExtreme: false, extremeTriggered: false };
                state.pendingBreakthrough = false;
                const stoneBonus = 20 + state.realmIndex * 10;
                state.spiritStone += stoneBonus;
                state.player.hp = Math.min(state.player.maxHp, state.player.hp + 30);
                state.forcedBreakthroughUsed[state.realmIndex] = false;
                showResult(true, `🎉 突破成功！踏入 ${next.name}，攻击+${bonusAtk}，防御+${bonusDef}，HP+${bonusHp}，获得 💎 ${stoneBonus} 灵石。`);
                checkBreakthrough();
                updateUI();
                saveGame();
            }

            // 强行渡劫
            function forcedBreakthrough() {
                const next = getNextRealm();
                if (!next || !state.pendingBreakthrough) { alert('没有可渡劫的境界'); return; }
                const forcedUsed = state.forcedBreakthroughUsed[state.realmIndex] || false;
                if (forcedUsed) { alert('本大境界已使用强行渡劫'); return; }
                if (getIsExtreme()) { alert('极境状态下无法强行渡劫'); return; }
                if (Math.random() < 0.05) {
                    const bonusAtk = 2 + state.realmIndex * 2;
                    const bonusDef = 1 + state.realmIndex;
                    const bonusHp = 10 + state.realmIndex * 5;
                    state.baseAttack += bonusAtk;
                    state.baseDefense += bonusDef;
                    state.baseMaxHp += bonusHp;
                    state.realmIndex++;
                    state.progress[state.realmIndex] = { subIndex: 0, isExtreme: false, extremeTriggered: false };
                    state.pendingBreakthrough = false;
                    const stoneBonus = 20 + state.realmIndex * 10;
                    state.spiritStone += stoneBonus;
                    state.player.hp = Math.min(state.player.maxHp, state.player.hp + 30);
                    state.forcedBreakthroughUsed[state.realmIndex] = true;
                    showResult(true, `🌈 强行渡劫成功！踏入 ${next.name}，属性提升！获得 💎 ${stoneBonus} 灵石。`);
                    checkBreakthrough();
                    updateUI();
                    saveGame();
                } else {
                    const { start, step } = getSubThresholds();
                    const subStart = start + getSubIndex() * step;
                    state.cultivation = subStart;
                    state.forcedBreakthroughUsed[state.realmIndex] = true;
                    showResult(false, '强行渡劫失败！修为扣光至小境界起始。');
                    updateUI();
                    saveGame();
                }
            }

            // 极境突破
            function extremeBreakthrough() {
                if (!getExtremeTriggered()) {
                    alert('尚未触发极境契机，无法突破！');
                    return;
                }
                if (getIsExtreme()) {
                    alert('已突破极境！');
                    return;
                }
                if (getSubIndex() !== 3) {
                    alert('需在巅峰境界才能突破极境！');
                    return;
                }
                state.baseAttack *= 3;
                state.baseDefense *= 3;
                state.baseMaxHp *= 3;
                state.progress[state.realmIndex].isExtreme = true;
                state.progress[state.realmIndex].extremeTriggered = false;
                state.pendingBreakthrough = false;
                recalcPlayerStats();
                showResult(true, '🌟 极境突破！全属性永久翻3倍！');
                updateUI();
                saveGame();
            }

            function tryTriggerExtreme() {
                if (getSubIndex() !== 3) return false;
                if (getIsExtreme()) return false;
                if (getExtremeTriggered()) return false;
                if (Math.random() < 0.01) {
                    state.progress[state.realmIndex].extremeTriggered = true;
                    addLog('🌈 你感应到了极境的契机！可在渡劫区域突破极境。');
                    showFloatText('🌟 极境契机！', document.getElementById('exploreBtn'));
                    updateUI();
                    saveGame();
                    return true;
                }
                return false;
            }

            function showResult(success, detail) {
                const old = document.querySelector('.result-overlay');
                if (old) old.remove();
                const overlay = document.createElement('div');
                overlay.className = 'result-overlay';
                const emoji = success ? '🌈' : '💢';
                const title = success ? '渡劫成功' : '渡劫失败';
                overlay.innerHTML = `
                        <div class="result-box">
                            <span class="emoji-big">${emoji}</span>
                            <h2>${title}</h2>
                            <div class="detail">${detail}</div>
                            <button class="btn-glow" id="resultOk">确定</button>
                        </div>
                    `;
                document.body.appendChild(overlay);
                document.getElementById('resultOk').addEventListener('click', () => { overlay.remove(); });
                setTimeout(() => { if (overlay.parentNode) overlay.remove(); }, 8000);
            }

            // ========== 修行 ==========
            function cultivate() {
                const gain = 1;
                state.cultivation += gain;
                state.totalCultivated += gain;
                if (Math.random() < 0.05) {
                    const stone = 1 + Math.floor(state.realmIndex / 2);
                    state.spiritStone += stone;
                    showFloatText(`💎 +${stone}`, cultivateBtn);
                }
                showFloatText(`+${gain} 修为`, cultivateBtn);
                createRipple(cultivateBtn);
                checkSubRealm();
                tryEnhanceBaseAttribute();
                checkBreakthrough();
                updateUI();
                saveGame();
            }

            function checkSubRealm() {
                const { start, end, step } = getSubThresholds();
                const current = state.cultivation;
                let newSub = 0;
                for (let i = 0; i < 4; i++) {
                    const subStart = start + i * step;
                    const subEnd = start + (i + 1) * step;
                    if (current >= subStart && current < subEnd) {
                        newSub = i;
                        break;
                    }
                    if (i === 3 && current >= subEnd) {
                        newSub = 3;
                    }
                }
                const prog = getCurrentProgress();
                if (prog.subIndex !== newSub) {
                    const oldSub = prog.subIndex;
                    // 小境界提升，属性加成
                    applySubRealmBonus(oldSub, newSub);
                    prog.subIndex = newSub;
                    updateUI();
                    saveGame();
                }
            }

            function tryEnhanceBaseAttribute() {
                if (!state.pendingBreakthrough) return;
                const next = getNextRealm();
                if (!next) return;
                if (Math.random() < 0.05) {
                    const choices = ['attack', 'defense', 'hp'];
                    const attr = choices[randInt(0, 2)];
                    const gain = 1 + Math.floor(state.realmIndex / 2);
                    if (attr === 'attack') {
                        state.baseAttack += gain;
                        showFloatText(`⚔️ 攻击 +${gain} (突破感悟)`, document.getElementById('cultivateBtn'));
                    } else if (attr === 'defense') {
                        state.baseDefense += gain;
                        showFloatText(`🛡️ 防御 +${gain} (突破感悟)`, document.getElementById('cultivateBtn'));
                    } else {
                        state.baseMaxHp += gain * 2;
                        showFloatText(`❤️ HP +${gain*2} (突破感悟)`, document.getElementById('cultivateBtn'));
                    }
                    recalcPlayerStats();
                    updateUI();
                    saveGame();
                }
            }

            // ========== 功法 ==========
            function upgradeSkill(skillId) {
                const skill = SKILLS.find(s => s.id === skillId);
                if (!skill) return;
                const currentLevel = state.skillLevels[skillId] || 0;
                if (currentLevel >= skill.maxLevel) {
                    alert(`${skill.name} 已达最高等级！`);
                    return;
                }
                const cost = getSkillCost(skillId);
                if (state.spiritStone < cost) { alert(`灵石不足！需要 ${cost} 灵石。`); return; }
                state.spiritStone -= cost;
                const newLevel = currentLevel + 1;
                state.skillLevels[skillId] = newLevel;
                recalcPlayerStats();
                showFloatText(`⬆ ${skill.name} Lv.${newLevel}`, document.getElementById('panel-skills'));
                renderSkills();
                updateUI();
                saveGame();
            }

            function getSkillCost(skillId) {
                const skill = SKILLS.find(s => s.id === skillId);
                if (!skill) return Infinity;
                const level = state.skillLevels[skillId] || 0;
                return Math.floor(skill.baseCost * (level + 1));
            }

            // ========== 装备合成（星级系统） ==========
            function synthesizeEquipment(itemId) {
                const base = EQUIP_TEMPLATES.find(e => e.id === itemId);
                if (!base) return;

                // 找出背包中所有相同ID且相同星级的装备（不包括已装备）
                const currentStar = 0; // 我们需要确定当前物品的星级，但函数从背包按钮调用时传入了itemId，但没有星级信息，我们只能通过查找所有该id的物品，取最高星级？
                // 实际上，合成时用户点击的是某个特定物品，但同一ID可能有不同星级，但合成规则要求三件相同星级。
                // 我们设计：在背包显示时，每个物品显示其星级，点击合成时，需要选择星级吗？为了简化，我们让合成按钮针对每个具体物品（即每个背包条目），但条目中包含了星级信息。
                // 在渲染背包时，每个条目都有一个data-star属性，合成按钮通过data-id和data-star来识别。
                // 我们修改背包渲染，给合成按钮添加data-star属性。
                // 下面我们写一个合成函数，接收itemId和star。
                // 但为了封装，我们直接在事件绑定中处理。
            }

            // 真正的合成函数，由事件调用
            function doSynthesize(itemId, star) {
                const base = EQUIP_TEMPLATES.find(e => e.id === itemId);
                if (!base) return;
                if (star >= 3) {
                    alert('已达到最高星级（三星），无法继续合成！');
                    return;
                }
                // 查找背包中所有相同id且相同星级的物品（不包括已装备）
                const items = state.backpack.filter(item => item.id === itemId && item.star === star);
                if (items.length < 3) {
                    alert(`需要3件 ${base.name}（${star}星）才能合成，当前只有 ${items.length} 件。`);
                    return;
                }
                // 消耗3件
                let removed = 0;
                for (let i = state.backpack.length - 1; i >= 0 && removed < 3; i--) {
                    if (state.backpack[i].id === itemId && state.backpack[i].star === star) {
                        state.backpack.splice(i, 1);
                        removed++;
                    }
                }
                // 生成1件星级+1的装备，强化等级取最高（或平均，这里取最高）
                let maxEnhance = 0;
                for (let i = 0; i < 3; i++) {
                    if (items[i].enhance > maxEnhance) maxEnhance = items[i].enhance;
                }
                const newStar = star + 1;
                state.backpack.push({ id: itemId, enhance: maxEnhance, star: newStar });

                // 重新计算并刷新UI
                recalcPlayerStats();
                renderEquip();
                updateUI();
                saveGame();
                showFloatText(`✨ ${base.name} 合成成功！获得 ${base.name} ★${newStar} (强化+${maxEnhance})`, document.getElementById(
                    'panel-equip'));
                addLog(`合成成功！${base.name} ★${newStar}`);
            }

            // ========== 装备其他操作 ==========
            function decomposeEquipment(itemId) {
                // 分解装备获得灵石，星级越高分解越多
                const idx = state.backpack.findIndex(item => item.id === itemId);
                if (idx === -1) { alert('背包中没有该装备'); return; }
                const item = state.backpack[idx];
                const base = EQUIP_TEMPLATES.find(e => e.id === item.id);
                if (!base) return;
                const star = item.star || 0;
                const stoneGain = 10 * (star + 1) * base.tier;
                state.backpack.splice(idx, 1);
                state.spiritStone += stoneGain;
                recalcPlayerStats();
                renderEquip();
                updateUI();
                saveGame();
                showFloatText(`💎 +${stoneGain} 灵石`, document.getElementById('panel-equip'));
                addLog(`分解 ${base.name} ★${star} 获得 ${stoneGain} 灵石`);
            }

            function enhanceEquipment(itemId) {
                // 强化功能保留，但强化只影响enhance，不影响星级
                const idx = state.backpack.findIndex(item => item.id === itemId);
                if (idx === -1) { alert('背包中没有该装备'); return; }
                const item = state.backpack[idx];
                const base = EQUIP_TEMPLATES.find(e => e.id === item.id);
                if (!base) return;
                if (item.enhance >= 10) { alert('已达最大强化等级'); return; }
                const cost = 10 + base.tier * 5 + item.enhance * 2;
                if (state.spiritStone < cost) { alert(`强化需要 ${cost} 灵石，当前 ${state.spiritStone}`); return; }
                state.spiritStone -= cost;
                item.enhance += 1;
                // 检查是否装备了该物品，若装备则同步更新装备栏
                for (let slot of ['weapon', 'armor', 'accessory']) {
                    const equip = state.equipment[slot];
                    if (equip && equip.id === itemId && equip.star === item.star) {
                        equip.enhance = item.enhance;
                        break;
                    }
                }
                recalcPlayerStats();
                renderEquip();
                updateUI();
                saveGame();
                showFloatText(`⬆ 强化成功！`, document.getElementById('panel-equip'));
                addLog(`强化 ${base.name} 到 +${item.enhance}`);
            }

            function equipItem(itemId) {
                const idx = state.backpack.findIndex(item => item.id === itemId);
                if (idx === -1) { alert('背包中没有该装备'); return; }
                const item = state.backpack[idx];
                const base = EQUIP_TEMPLATES.find(e => e.id === itemId);
                if (!base) return;
                const slot = base.type;
                if (state.equipment[slot]) {
                    const old = state.equipment[slot];
                    state.backpack.push({ id: old.id, enhance: old.enhance || 0, star: old.star || 0 });
                }
                state.equipment[slot] = { id: itemId, enhance: item.enhance, star: item.star };
                state.backpack.splice(idx, 1);
                recalcPlayerStats();
                renderEquip();
                updateUI();
                saveGame();
                showFloatText(`装备了 ${base.name}`, document.getElementById('panel-equip'));
            }

            function unequipItem(slot) {
                const equip = state.equipment[slot];
                if (!equip) return;
                state.backpack.push({ id: equip.id, enhance: equip.enhance || 0, star: equip.star || 0 });
                state.equipment[slot] = null;
                recalcPlayerStats();
                renderEquip();
                updateUI();
                saveGame();
                const base = EQUIP_TEMPLATES.find(e => e.id === equip.id);
                showFloatText(`卸下了 ${base ? base.name : '装备'}`, document.getElementById('panel-equip'));
            }

            function batchDecompose() {
                // 批量分解所有非三星装备（或全部？这里只分解三星以下的）
                let totalStone = 0;
                for (let i = state.backpack.length - 1; i >= 0; i--) {
                    const item = state.backpack[i];
                    if (item.star < 3) {
                        const base = EQUIP_TEMPLATES.find(e => e.id === item.id);
                        if (base) {
                            totalStone += 10 * (item.star + 1) * base.tier;
                            state.backpack.splice(i, 1);
                        }
                    }
                }
                if (totalStone > 0) {
                    state.spiritStone += totalStone;
                    recalcPlayerStats();
                    renderEquip();
                    updateUI();
                    saveGame();
                    showFloatText(`💎 +${totalStone} 灵石`, document.getElementById('panel-equip'));
                    addLog(`批量分解获得 ${totalStone} 灵石`);
                } else { alert('没有可分解的装备（三星以下）'); }
            }

            // ========== 灵兽分解 ==========
            function decomposeEgg(eggId) {
                if (!confirm(`确定要分解这个 ${EGG_TYPES[eggId]?.name || eggId} 吗？将获得 20 灵石。`)) return;
                const idx = state.eggs.indexOf(eggId);
                if (idx === -1) return;
                state.eggs.splice(idx, 1);
                state.spiritStone += 20;
                showFloatText(`💎 +20 灵石 (分解蛋)`, document.getElementById('panel-pet'));
                addLog(`分解 ${EGG_TYPES[eggId]?.name || eggId} 获得 20 灵石`);
                renderPets();
                updateUI();
                saveGame();
            }

            function decomposePet(petId) {
                const pet = state.pets.find(p => p.id === petId);
                if (!pet) return;
                const baseStone = 30 + Math.floor((pet.attack + pet.defense + pet.maxHp) / 5) + pet.advanceLevel * 50;
                if (!confirm(`确定要分解 ${pet.name} 吗？将获得 ${baseStone} 灵石。`)) return;
                state.pets = state.pets.filter(p => p.id !== petId);
                state.spiritStone += baseStone;
                showFloatText(`💎 +${baseStone} 灵石 (分解灵兽)`, document.getElementById('panel-pet'));
                addLog(`分解 ${pet.name} 获得 ${baseStone} 灵石`);
                recalcPlayerStats();
                renderPets();
                updateUI();
                saveGame();
            }

            // ========== 灵兽 ==========
            function hatchEgg(eggId) {
                const eggDef = EGG_TYPES[eggId];
                if (!eggDef) return;
                const matMap = {
                    egg_bamboo: '竹叶',
                    egg_flame: '火羽',
                    egg_wolf: '狼牙',
                    egg_star: '星沙',
                    egg_fire: '火晶',
                    egg_moon: '月露',
                    egg_ghost: '魂晶',
                    egg_sword: '剑意精华'
                };
                const needMat = matMap[eggId];
                const costStone = 100 + state.realmIndex * 20;
                if (state.spiritStone < costStone) { alert(`孵化需要 ${costStone} 灵石`); return; }
                if ((state.materials[needMat] || 0) < 1) { alert(`需要 1 个 ${needMat} 材料`); return; }
                state.spiritStone -= costStone;
                state.materials[needMat] = (state.materials[needMat] || 0) - 1;
                const idx = state.eggs.indexOf(eggId);
                if (idx !== -1) state.eggs.splice(idx, 1);
                const pet = {
                    id: 'pet_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                    type: eggId,
                    name: eggDef.petName,
                    level: 1,
                    exp: 0,
                    attack: eggDef.baseAtk,
                    defense: eggDef.baseDef,
                    hp: eggDef.baseHp,
                    maxHp: eggDef.baseHp,
                    skills: eggDef.skills,
                    mode: 'idle',
                    hp: eggDef.baseHp,
                    advanceLevel: 0,
                };
                state.pets.push(pet);
                showFloatText(`🐣 孵化成功！获得 ${pet.name}`, document.getElementById('panel-pet'));
                addLog(`孵化 ${pet.name} 成功！`);
                recalcPlayerStats();
                renderPets();
                updateUI();
                saveGame();
            }

            function advancePet(petId) {
                const pet = state.pets.find(p => p.id === petId);
                if (!pet) return;
                const eggId = pet.type;
                const eggDef = EGG_TYPES[eggId];
                if (!eggDef) return;
                const matMap = {
                    egg_bamboo: '竹叶',
                    egg_flame: '火羽',
                    egg_wolf: '狼牙',
                    egg_star: '星沙',
                    egg_fire: '火晶',
                    egg_moon: '月露',
                    egg_ghost: '魂晶',
                    egg_sword: '剑意精华'
                };
                const needMat = matMap[eggId];
                const countEggs = state.eggs.filter(id => id === eggId).length;
                if (countEggs < 3) { alert(`需要 3 个 ${eggDef.name} 才能进阶`); return; }
                if ((state.materials[needMat] || 0) < 5) { alert(`需要 5 个 ${needMat} 材料`); return; }
                const costStone = 500 + pet.advanceLevel * 300;
                if (state.spiritStone < costStone) { alert(`需要 ${costStone} 灵石`); return; }
                state.spiritStone -= costStone;
                state.materials[needMat] = (state.materials[needMat] || 0) - 5;
                let removed = 0;
                for (let i = state.eggs.length - 1; i >= 0 && removed < 3; i--) {
                    if (state.eggs[i] === eggId) { state.eggs.splice(i, 1);
                        removed++; }
                }
                pet.advanceLevel += 1;
                pet.attack = Math.floor(eggDef.baseAtk * (1 + pet.advanceLevel * 0.3));
                pet.defense = Math.floor(eggDef.baseDef * (1 + pet.advanceLevel * 0.3));
                pet.maxHp = Math.floor(eggDef.baseHp * (1 + pet.advanceLevel * 0.3));
                pet.hp = pet.maxHp;
                showFloatText(`⬆ ${pet.name} 进阶！`, document.getElementById('panel-pet'));
                addLog(`${pet.name} 进阶到 ${pet.advanceLevel} 阶`);
                recalcPlayerStats();
                renderPets();
                updateUI();
                saveGame();
            }

            function setPetMode(petId, mode) {
                const pet = state.pets.find(p => p.id === petId);
                if (!pet) return;
                if (mode !== 'idle' && mode !== 'fight' && mode !== 'bless') return;
                if (mode === pet.mode) {
                    pet.mode = 'idle';
                } else {
                    pet.mode = mode;
                }
                recalcPlayerStats();
                renderPets();
                updateUI();
                saveGame();
            }

            function petFightAction(monster, player) {
                const fighters = state.pets.filter(p => p.mode === 'fight' && p.hp > 0);
                if (fighters.length === 0) return null;
                const pet = fighters[randInt(0, fighters.length - 1)];
                const skillName = pet.skills[randInt(0, pet.skills.length - 1)];
                const effect = SKILL_EFFECTS[skillName];
                if (!effect) return null;
                let value = effect.value;
                if (effect.type === 'damage') {
                    value = Math.floor(value + pet.attack * 0.2);
                } else if (effect.type === 'heal') {
                    value = Math.floor(value + pet.defense * 0.2);
                } else if (effect.type === 'buff') {
                    value = Math.floor(value + pet.defense * 0.1);
                }
                return { pet, skillName, effect, value };
            }

            // ========== 地图与战斗（探索无怪） ==========
            function getCurrentRegion() {
                return REGIONS[state.currentRegion] || REGIONS[0];
            }

            function addLog(msg) {
                const entry = document.createElement('div');
                entry.className = 'log-entry';
                const time = new Date().toLocaleTimeString();
                entry.innerHTML = `<span class="time">${time}</span> ${msg}`;
                logArea.appendChild(entry);
                logArea.scrollTop = logArea.scrollHeight;
                if (logArea.children.length > 50) logArea.removeChild(logArea.firstChild);
            }

            function canEnterRegion(region) {
                if (!region.requirements) return true;
                const req = region.requirements;
                const player = state.player;
                if (player.attack < req.attack) return false;
                if (player.defense < req.defense) return false;
                if (player.maxHp < req.hp) return false;
                return true;
            }

            function renderRegions() {
                let html = '';
                REGIONS.forEach((r, idx) => {
                    const active = idx === state.currentRegion ? 'active' : '';
                    const locked = !canEnterRegion(r) ? 'locked' : '';
                    const dropNames = r.dropPool.map(id => {
                        const item = EQUIP_TEMPLATES.find(e => e.id === id);
                        return item ? item.name : '';
                    }).filter(Boolean).join('、');
                    let reqText = '';
                    if (r.requirements) {
                        const req = r.requirements;
                        reqText = `需要: 攻击${req.attack} 防御${req.defense} HP${req.hp}`;
                    }
                    const eggNames = (r.eggDrop || []).map(id => EGG_TYPES[id] ? EGG_TYPES[id].name : id).join('、');
                    const matNames = r.materialDrop ? Object.keys(r.materialDrop).join('、') : '';
                    const exploreCount = state.regionExploreCount[r.id] || 0;
                    const bossReady = exploreCount >= 20;
                    html += `
                            <div class="region-card ${active} ${locked}" data-idx="${idx}">
                                <span class="region-icon">${r.icon}</span>
                                <div class="region-name">${r.name}</div>
                                <div class="region-info">Lv.${r.level} · ${r.monster.name}</div>
                                <div class="region-drop">🎁 ${dropNames || '无'}</div>
                                <div style="font-size:10px; color:#6a8a6a;">🥚 ${eggNames || ''}  📦 ${matNames || ''}</div>
                                ${reqText ? `<div class="region-requirement">${reqText}</div>` : ''}
                                <div class="region-boss">👹 BOSS: ${r.boss.name} ${bossReady ? '✅可挑战' : `(${exploreCount}/20)`}</div>
                            </div>
                        `;
                });
                regionGrid.innerHTML = html;
                regionGrid.querySelectorAll('.region-card').forEach(card => {
                    card.addEventListener('click', function() {
                        const idx = parseInt(this.dataset.idx);
                        const region = REGIONS[idx];
                        if (!canEnterRegion(region)) {
                            alert(`属性不足，无法进入 ${region.name}！需要攻击${region.requirements.attack}，防御${region.requirements.defense}，HP${region.requirements.hp}`);
                            return;
                        }
                        state.currentRegion = idx;
                        regionSelect.value = idx;
                        renderRegions();
                        addLog(`前往 ${REGIONS[idx].name}`);
                        saveGame();
                    });
                });
                regionSelect.innerHTML = '';
                REGIONS.forEach((r, idx) => {
                    const opt = document.createElement('option');
                    opt.value = idx;
                    opt.textContent = r.icon + ' ' + r.name;
                    regionSelect.appendChild(opt);
                });
                regionSelect.value = state.currentRegion;
                updateBossButton();
            }

            function updateBossButton() {
                const region = getCurrentRegion();
                const count = state.regionExploreCount[region.id] || 0;
                bossBtn.disabled = count < 20;
                bossBtn.textContent = count >= 20 ? '👹 挑战BOSS (已就绪)' : `👹 挑战BOSS (${count}/20)`;
            }

            function dropEggsAndMaterials(region) {
                if (region.eggDrop && region.eggDrop.length > 0 && Math.random() < 0.15) {
                    const eggId = region.eggDrop[randInt(0, region.eggDrop.length - 1)];
                    state.eggs.push(eggId);
                    addLog(`🥚 获得 ${EGG_TYPES[eggId].name}`);
                    showFloatText(`🥚 ${EGG_TYPES[eggId].name}`, document.getElementById('exploreBtn'));
                }
                if (region.materialDrop) {
                    const matIds = Object.keys(region.materialDrop);
                    if (matIds.length > 0 && Math.random() < 0.25) {
                        const matId = matIds[randInt(0, matIds.length - 1)];
                        const count = region.materialDrop[matId] || 1;
                        state.materials[matId] = (state.materials[matId] || 0) + count;
                        addLog(`📦 获得 ${matId} x${count}`);
                        showFloatText(`📦 ${matId}`, document.getElementById('exploreBtn'));
                    }
                }
            }

            function randomDropFromRegion(region) {
                const pool = region.dropPool || [];
                if (pool.length === 0) return null;
                const valid = pool.filter(id => EQUIP_TEMPLATES.some(e => e.id === id));
                if (valid.length === 0) return null;
                const id = valid[randInt(0, valid.length - 1)];
                return EQUIP_TEMPLATES.find(e => e.id === id);
            }

            // 探索事件（无战斗）
            function explore() {
                if (state.inBattle) return;
                const region = getCurrentRegion();
                if (!canEnterRegion(region)) { alert(`属性不足，无法探索 ${region.name}！`); return; }
                state.regionExploreCount[region.id] = (state.regionExploreCount[region.id] || 0) + 1;
                updateBossButton();

                const allEvents = region.events;
                const nonCombatEvents = allEvents.filter(e => !e.includes('战斗！'));
                if (nonCombatEvents.length === 0) {
                    addLog('无事发生...');
                    saveGame();
                    return;
                }
                const evt = nonCombatEvents[randInt(0, nonCombatEvents.length - 1)];
                addLog(`🔍 ${evt}`);

                if (evt.includes('修为')) {
                    const gain = randInt(5, 15) + state.realmIndex * 1;
                    state.cultivation += gain;
                    showFloatText(`+${gain}修为`, exploreBtn);
                } else if (evt.includes('灵石')) {
                    let gain = randInt(30, 60) + state.realmIndex * 5;
                    if (evt.includes('珍珠') || evt.includes('仙石')) {
                        gain = randInt(60, 120) + state.realmIndex * 8;
                    }
                    state.spiritStone += gain;
                    showFloatText(`💎 +${gain}`, exploreBtn);
                } else if (evt.includes('装备')) {
                    const drop = randomDropFromRegion(region);
                    if (drop) {
                        state.backpack.push({ id: drop.id, enhance: 0, star: 0 });
                        addLog(`🎁 获得装备: ${drop.name}`);
                        showFloatText(`🎁 ${drop.name}`, exploreBtn);
                    } else { addLog('宝箱是空的...'); }
                } else if (evt.includes('HP')) {
                    const heal = randInt(10, 30);
                    state.player.hp = Math.min(state.player.maxHp, state.player.hp + heal);
                    addLog(`❤️ 恢复 ${heal} HP`);
                } else if (evt.includes('攻击')) {
                    state.baseAttack += 1;
                    recalcPlayerStats();
                    addLog(`⚔️ 攻击永久 +1`);
                } else {
                    // 其他
                }

                dropEggsAndMaterials(region);
                tryTriggerExtreme();
                tryEnhanceBaseAttribute();
                checkBreakthrough();
                updateUI();
                saveGame();
            }

            // BOSS挑战
            function challengeBoss() {
                if (state.inBattle) return;
                const region = getCurrentRegion();
                if (!canEnterRegion(region)) { alert(`属性不足，无法挑战 ${region.name} 的BOSS！`); return; }
                const count = state.regionExploreCount[region.id] || 0;
                if (count < 20) { alert(`需要探索20次，当前${count}次`); return; }
                addLog(`👹 挑战BOSS：${region.boss.name}！`);
                startBattle(region.boss, true);
            }

            // 战斗
            function startBattle(monster, isBoss = false) {
                if (state.inBattle) return;
                const region = getCurrentRegion();
                state.inBattle = true;
                exploreBtn.disabled = true;
                battleBtn.disabled = true;
                bossBtn.disabled = true;
                addLog(`⚔️ 遭遇 ${monster.name}！`);

                let mHp = monster.hp + state.realmIndex * 2;
                const mAtk = monster.attack + state.realmIndex;
                const mDef = monster.defense + Math.floor(state.realmIndex / 2);
                const player = state.player;
                let round = 0;
                let petActive = state.pets.some(p => p.mode === 'fight' && p.hp > 0);

                const timer = setInterval(() => {
                    round++;
                    const pDamage = Math.max(1, player.attack - mDef + randInt(-2, 4));
                    mHp -= pDamage;
                    addLog(`⚡ 你造成 ${pDamage} 伤害`);

                    if (petActive && Math.random() < 0.3) {
                        const petAction = petFightAction(monster, player);
                        if (petAction) {
                            const { pet, skillName, effect, value } = petAction;
                            if (effect.type === 'damage') {
                                const dmg = Math.max(1, value - mDef + randInt(-1, 2));
                                mHp -= dmg;
                                addLog(`🐉 ${pet.name} 释放 ${skillName}，造成 ${dmg} 伤害`);
                            } else if (effect.type === 'heal') {
                                const heal = Math.floor(value * 0.5);
                                state.player.hp = Math.min(state.player.maxHp, state.player.hp + heal);
                                addLog(`🐉 ${pet.name} 释放 ${skillName}，回复 ${heal} HP`);
                            } else if (effect.type === 'buff') {
                                const bonus = Math.floor(value * 0.3);
                                state.player.defense += bonus;
                                setTimeout(() => { state.player.defense -= bonus; }, 3000);
                                addLog(`🐉 ${pet.name} 释放 ${skillName}，防御 +${bonus}`);
                            } else if (effect.type === 'debuff') {
                                const debuff = Math.floor(value * 0.3);
                                window._monsterAtkDebuff = (window._monsterAtkDebuff || 0) + debuff;
                                addLog(`🐉 ${pet.name} 释放 ${skillName}，怪物攻击 -${debuff}`);
                            }
                        }
                    }

                    if (mHp <= 0) {
                        const playerAlive = player.hp > 0;
                        clearInterval(timer);
                        state.inBattle = false;
                        exploreBtn.disabled = false;
                        battleBtn.disabled = false;
                        bossBtn.disabled = false;
                        if (playerAlive) {
                            const expGain = monster.exp + state.realmIndex * 3;
                            state.cultivation += expGain;
                            const stoneGain = randInt(2, 8) + state.realmIndex;
                            state.spiritStone += stoneGain;
                            let dropItem = null;
                            if (Math.random() < 0.35) {
                                const d = randomDropFromRegion(region);
                                if (d) { state.backpack.push({ id: d.id, enhance: 0, star: 0 });
                                    dropItem = d;
                                    addLog(`🎁 掉落装备: ${d.name}`); }
                            }
                            let artifactDrop = null;
                            if (isBoss && Math.random() < 0.1) {
                                const art = ARTIFACT_TEMPLATES[randInt(0, ARTIFACT_TEMPLATES.length - 1)];
                                state.artifacts.push(art.id);
                                artifactDrop = art;
                                addLog(`🔮 获得法宝：${art.name}`);
                            }
                            dropEggsAndMaterials(region);
                            state.player.hp = Math.min(state.player.maxHp, state.player.hp + 15);
                            state.pets.forEach(p => { if (p.mode === 'fight') p.hp = p.maxHp; });
                            if (!isBoss) tryTriggerExtreme();
                            checkBreakthrough();
                            updateUI();
                            saveGame();
                            let msg =
                                `胜利！修为 +${expGain}，灵石 +${stoneGain}${dropItem ? '，获得 '+dropItem.name : ''}`;
                            if (artifactDrop) msg += `，获得法宝 ${artifactDrop.name}`;
                            showResult(true, msg);
                        } else {
                            const expGain = Math.floor((monster.exp + state.realmIndex * 3) / 2);
                            state.cultivation += expGain;
                            const stoneGain = Math.floor((randInt(2, 8) + state.realmIndex) / 2);
                            state.spiritStone += stoneGain;
                            state.player.hp = 1;
                            state.pets.forEach(p => { if (p.mode === 'fight') p.hp = p.maxHp; });
                            addLog(`💀 惨胜！你与怪物同归于尽，奖励减半。`);
                            checkBreakthrough();
                            updateUI();
                            saveGame();
                            showResult(true, `惨胜！修为 +${expGain}，灵石 +${stoneGain}（奖励减半）`);
                        }
                        return;
                    }
                    if (state.player.hp <= 0) {
                        clearInterval(timer);
                        state.inBattle = false;
                        exploreBtn.disabled = false;
                        battleBtn.disabled = false;
                        bossBtn.disabled = false;
                        state.player.hp = 1;
                        state.pets.forEach(p => { if (p.mode === 'fight') p.hp = p.maxHp; });
                        const penalty = Math.floor(10 + state.realmIndex * 2);
                        state.cultivation = Math.max(0, state.cultivation - penalty);
                        if (isBoss) {
                            state.regionExploreCount[region.id] = 0;
                            addLog(`💢 BOSS挑战失败，探索进度重置！`);
                        }
                        updateUI();
                        saveGame();
                        showResult(false, `败北... 修为 -${penalty}${isBoss ? '，BOSS探索进度已重置' : ''}`);
                        addLog(`💀 你败了... 修为 -${penalty}`);
                        return;
                    }
                    let mDamage = Math.max(1, mAtk - player.defense + randInt(-2, 3));
                    if (window._monsterAtkDebuff && window._monsterAtkDebuff > 0) {
                        mDamage = Math.max(1, mDamage - window._monsterAtkDebuff);
                        window._monsterAtkDebuff = Math.max(0, window._monsterAtkDebuff - 1);
                    }
                    state.player.hp -= mDamage;
                    addLog(`💥 ${monster.name} 造成 ${mDamage} 伤害`);
                    if (state.player.hp <= 0) {
                        clearInterval(timer);
                        state.inBattle = false;
                        exploreBtn.disabled = false;
                        battleBtn.disabled = false;
                        bossBtn.disabled = false;
                        state.player.hp = 1;
                        state.pets.forEach(p => { if (p.mode === 'fight') p.hp = p.maxHp; });
                        const penalty = Math.floor(10 + state.realmIndex * 2);
                        state.cultivation = Math.max(0, state.cultivation - penalty);
                        if (isBoss) {
                            state.regionExploreCount[region.id] = 0;
                            addLog(`💢 BOSS挑战失败，探索进度重置！`);
                        }
                        updateUI();
                        saveGame();
                        showResult(false, `败北... 修为 -${penalty}${isBoss ? '，BOSS探索进度已重置' : ''}`);
                        addLog(`💀 你败了... 修为 -${penalty}`);
                        return;
                    }
                    updateUI();
                }, 700);
                state.battleTimer = timer;
            }

            function challengeMonster() {
                if (state.inBattle) return;
                const region = getCurrentRegion();
                if (!canEnterRegion(region)) { alert(`属性不足，无法挑战 ${region.name} 的怪物！`); return; }
                startBattle(region.monster);
            }

            // ========== 无限征途 ==========
            function startInfinite() {
                if (state.realmIndex < REALMS.length - 1) {
                    alert('需要达到最高境界（飞升）才能开启无限征途');
                    return;
                }
                const names = ['混沌魔尊', '太虚圣皇', '无极天尊', '玄天老祖', '九幽大帝', '星辰主宰', '万劫神王', '不灭仙帝'];
                const name = names[randInt(0, names.length - 1)];
                const baseHp = 2000 + state.infiniteBossCount * 200;
                const baseAtk = 150 + state.infiniteBossCount * 15;
                const baseDef = 50 + state.infiniteBossCount * 5;
                const exp = 500 + state.infiniteBossCount * 50;
                const boss = {
                    name: name,
                    hp: baseHp,
                    attack: baseAtk,
                    defense: baseDef,
                    exp: exp,
                };
                addLog(`🌌 无限征途：遭遇 ${boss.name}！`);
                startBattle(boss, true);
                state.infiniteBossCount++;
                saveGame();
            }

            // ========== 法宝 ==========
            function renderArtifacts() {
                let html = '';
                if (state.artifacts.length === 0) {
                    html = '<div style="color:#8a9a7a; text-align:center; padding:20px 0; grid-column:1/3;">暂无法宝</div>';
                } else {
                    state.artifacts.forEach(id => {
                        const art = ARTIFACT_TEMPLATES.find(a => a.id === id);
                        if (!art) return;
                        html += `
                                <div class="artifact-card">
                                    <div class="art-name">🔮 ${art.name}</div>
                                    <div class="art-desc">${art.desc}</div>
                                    <div class="art-skills">主动：${art.active.name}（${art.active.desc}）</div>
                                    <div class="art-skills">被动1：${art.passive[0].name}（${art.passive[0].desc}）</div>
                                    <div class="art-skills">被动2：${art.passive[1].name}（${art.passive[1].desc}）</div>
                                </div>
                            `;
                    });
                }
                artifactGrid.innerHTML = html;
            }

            // ========== 渲染 ==========
            function renderSkills() {
                let html = '';
                SKILLS.forEach(skill => {
                    const level = state.skillLevels[skill.id] || 0;
                    const unlocked = level > 0;
                    const maxLevel = skill.maxLevel;
                    const cost = getSkillCost(skill.id);
                    const canAfford = state.spiritStone >= cost;
                    const isMax = level >= maxLevel;
                    const lockedClass = unlocked ? 'unlocked' : '';
                    let atkBonus = 0,
                        defBonus = 0,
                        hpBonus = 0;
                    if (skill.effect.exponential) {
                        const multiplier = Math.pow(2, level - 1);
                        atkBonus = skill.effect.attack * multiplier;
                        defBonus = skill.effect.defense * multiplier;
                        hpBonus = skill.effect.hp * multiplier;
                    } else {
                        atkBonus = skill.effect.attack * level;
                        defBonus = skill.effect.defense * level;
                        hpBonus = skill.effect.hp * level;
                    }
                    const parts = [];
                    if (atkBonus > 0) parts.push(`攻击+${atkBonus}`);
                    if (defBonus > 0) parts.push(`防御+${defBonus}`);
                    if (hpBonus > 0) parts.push(`HP+${hpBonus}`);
                    const statsText = parts.join(' ');
                    const levelText = maxLevel === Infinity ? `Lv.${level}` : `Lv.${level}/${maxLevel}`;
                    const badgeText = unlocked ? levelText : `消耗 ${cost} 灵石`;
                    const btnText = unlocked ? (isMax ? '已满级' : `升级 (${cost})`) : '领悟';
                    const disabled = !canAfford || isMax;
                    html += `
                            <div class="skill-card ${lockedClass}">
                                <div class="skill-name">
                                    ${skill.name}
                                    <span class="badge">${badgeText}</span>
                                </div>
                                <div class="skill-desc">${skill.desc}</div>
                                ${statsText ? `<div class="skill-stats">✨ ${statsText}</div>` : ''}
                                <button class="btn-unlock" data-id="${skill.id}" ${disabled ? 'disabled' : ''}>
                                    ${btnText}
                                </button>
                            </div>
                        `;
                });
                skillsGrid.innerHTML = html;
                skillsGrid.querySelectorAll('.btn-unlock').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = this.dataset.id;
                        upgradeSkill(id);
                    });
                });
            }

            function renderEquip() {
                // 装备栏
                const slots = ['weapon', 'armor', 'accessory'];
                const slotNames = { weapon: '⚔️ 武器', armor: '🛡️ 防具', accessory: '💍 饰品' };
                let html = '';
                for (const slot of slots) {
                    const equip = state.equipment[slot];
                    let item = null,
                        enhance = 0,
                        star = 0;
                    if (equip) {
                        const stats = getEquipStats(equip.id, equip.enhance || 0, equip.star || 0);
                        if (stats) { item = stats;
                            enhance = equip.enhance || 0;
                            star = equip.star || 0; }
                    }
                    const has = item !== null;
                    let statsText = '';
                    if (item) {
                        const parts = [];
                        if (item.attack > 0) parts.push(`攻击+${item.attack}`);
                        if (item.defense > 0) parts.push(`防御+${item.defense}`);
                        if (item.hp > 0) parts.push(`HP+${item.hp}`);
                        statsText = parts.join(' ');
                        if (enhance > 0) statsText += ` +${enhance}`;
                        if (star > 0) statsText += ` ★${star}`;
                    }
                    html += `
                            <div class="equip-slot ${has ? 'has-equip' : ''}">
                                <div class="slot-label">${slotNames[slot]}</div>
                                ${has ? `<div class="equip-name">${item.name}</div><div class="equip-stats">${statsText}</div>
                                    <button class="unequip-btn" data-slot="${slot}">卸下</button>` 
                                    : `<div style="color:#8a9a7a; font-size:13px;">空</div>`}
                            </div>
                        `;
                }
                equipGrid.innerHTML = html;
                equipGrid.querySelectorAll('.unequip-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const slot = this.dataset.slot;
                        unequipItem(slot);
                    });
                });

                // 背包
                let bpHtml = '';
                if (state.backpack.length === 0) {
                    bpHtml = '<div style="color:#8a9a7a; text-align:center; padding:10px 0;">背包空空如也</div>';
                } else {
                    const groups = {};
                    state.backpack.forEach(item => {
                        const key = item.id + '|' + item.star;
                        if (!groups[key]) groups[key] = { count: 0, enhance: item.enhance || 0, id: item.id,
                            star: item.star };
                        groups[key].count++;
                        if (item.enhance > groups[key].enhance) groups[key].enhance = item.enhance;
                    });
                    for (const key in groups) {
                        const g = groups[key];
                        const base = EQUIP_TEMPLATES.find(e => e.id === g.id);
                        if (!base) continue;
                        const stats = getEquipStats(g.id, g.enhance, g.star);
                        let statsText = '';
                        if (stats) {
                            const parts = [];
                            if (stats.attack > 0) parts.push(`攻击+${stats.attack}`);
                            if (stats.defense > 0) parts.push(`防御+${stats.defense}`);
                            if (stats.hp > 0) parts.push(`HP+${stats.hp}`);
                            statsText = parts.join(' ');
                        }
                        const starDisplay = g.star > 0 ? ` ★${g.star}` : '';
                        const enhanceDisplay = g.enhance > 0 ? ` +${g.enhance}` : '';
                        const canSynthesize = g.star < 3 && g.count >= 3;
                        bpHtml += `
                                <div class="backpack-item">
                                    <span class="item-name">${base.name}${starDisplay} ${enhanceDisplay}</span>
                                    <span class="item-stats">${statsText} ×${g.count}</span>
                                    <div class="item-actions">
                                        <button class="equip-action" data-id="${g.id}" data-star="${g.star}">装备</button>
                                        <button class="btn-enhance" data-id="${g.id}" data-star="${g.star}">强化</button>
                                        ${canSynthesize ? `<button class="btn-synthesize" data-id="${g.id}" data-star="${g.star}">合成</button>` : ''}
                                        <button class="btn-decompose" data-id="${g.id}" data-star="${g.star}">分解</button>
                                    </div>
                                </div>
                            `;
                    }
                }
                backpackArea.innerHTML = bpHtml;
                // 绑定事件
                backpackArea.querySelectorAll('.equip-action').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = this.dataset.id;
                        equipItem(id); // 装备时取第一个该id的物品
                    });
                });
                backpackArea.querySelectorAll('.btn-enhance').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = this.dataset.id;
                        enhanceEquipment(id);
                    });
                });
                backpackArea.querySelectorAll('.btn-synthesize').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = this.dataset.id;
                        const star = parseInt(this.dataset.star);
                        doSynthesize(id, star);
                    });
                });
                backpackArea.querySelectorAll('.btn-decompose').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = this.dataset.id;
                        decomposeEquipment(id);
                    });
                });
            }

            function renderPets() {
                let eggHtml = '';
                if (state.eggs.length === 0) {
                    eggHtml = '<div style="color:#8a9a7a; text-align:center; padding:8px 0;">暂无灵兽蛋</div>';
                } else {
                    const eggCounts = {};
                    state.eggs.forEach(id => { eggCounts[id] = (eggCounts[id] || 0) + 1; });
                    for (const [id, count] of Object.entries(eggCounts)) {
                        const def = EGG_TYPES[id];
                        if (!def) continue;
                        const matMap = {
                            egg_bamboo: '竹叶',
                            egg_flame: '火羽',
                            egg_wolf: '狼牙',
                            egg_star: '星沙',
                            egg_fire: '火晶',
                            egg_moon: '月露',
                            egg_ghost: '魂晶',
                            egg_sword: '剑意精华'
                        };
                        const needMat = matMap[id] || '未知';
                        eggHtml += `
                                <div class="pet-card">
                                    <div class="pet-egg">
                                        <span style="font-size:28px;">${def.icon}</span>
                                        <span class="egg-info">${def.name} x${count}</span>
                                        <button class="btn-hatch" data-egg="${id}">🐣 孵化 (100灵石 + 1 ${needMat})</button>
                                        <button class="btn-decompose-egg" data-egg="${id}">💠 分解 (20灵石)</button>
                                    </div>
                                </div>
                            `;
                    }
                }
                eggList.innerHTML = eggHtml;
                eggList.querySelectorAll('.btn-hatch').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const eggId = this.dataset.egg;
                        hatchEgg(eggId);
                    });
                });
                eggList.querySelectorAll('.btn-decompose-egg').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const eggId = this.dataset.egg;
                        decomposeEgg(eggId);
                    });
                });

                let petHtml = '';
                if (state.pets.length === 0) {
                    petHtml = '<div style="color:#8a9a7a; text-align:center; padding:8px 0;">暂无已孵化灵兽</div>';
                } else {
                    state.pets.forEach(pet => {
                        const def = EGG_TYPES[pet.type];
                        if (!def) return;
                        const isFight = pet.mode === 'fight';
                        const isBless = pet.mode === 'bless';
                        petHtml += `
                                <div class="pet-card">
                                    <div class="pet-top">
                                        <span class="pet-name">${def.icon} ${pet.name} Lv.${pet.level} (阶${pet.advanceLevel})</span>
                                        <span class="pet-stats">⚔️${pet.attack} 🛡️${pet.defense} ❤️${pet.hp}/${pet.maxHp}</span>
                                    </div>
                                    <div class="pet-skills">技能: ${pet.skills.join('、')}</div>
                                    <div class="pet-actions">
                                        <button class="${isFight ? 'active-mode' : ''}" data-pet="${pet.id}" data-mode="fight">⚔️出战</button>
                                        <button class="${isBless ? 'active-mode' : ''}" data-pet="${pet.id}" data-mode="bless">✨加持</button>
                                        <button class="btn-advance-pet" data-pet="${pet.id}">⬆进阶 (3蛋+5材料+灵石)</button>
                                        <button class="btn-decompose-pet" data-pet="${pet.id}">💠 分解</button>
                                    </div>
                                </div>
                            `;
                    });
                }
                petList.innerHTML = petHtml;
                petList.querySelectorAll('[data-mode]').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const petId = this.dataset.pet;
                        const mode = this.dataset.mode;
                        setPetMode(petId, mode);
                    });
                });
                petList.querySelectorAll('.btn-advance-pet').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const petId = this.dataset.pet;
                        advancePet(petId);
                    });
                });
                petList.querySelectorAll('.btn-decompose-pet').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const petId = this.dataset.pet;
                        decomposePet(petId);
                    });
                });

                let matHtml = '';
                for (const [id, count] of Object.entries(state.materials)) {
                    if (count > 0) {
                        matHtml += `<span class="mat-item">${id}: ${count}</span>`;
                    }
                }
                materialDisplay.innerHTML = matHtml || '无材料';
            }

            function updateUI() {
                const realm = getRealm();
                const next = getNextRealm();
                const subName = getSubRealmName();
                let realmText = realm.name;
                if (getIsExtreme()) {
                    realmText += '·极境';
                } else {
                    realmText += `·${subName}`;
                }
                realmDisplay.innerHTML = realmText;

                const progress = getSubProgress() * 100;
                progressBar.style.width = Math.min(100, progress) + '%';

                cultivationDisplay.textContent = `修为: ${Math.floor(state.cultivation)}`;
                rateDisplay.textContent = `⚡ 手动修行`;
                clickPowerDisplay.textContent = `+1`;
                spiritStoneDisplay.textContent = state.spiritStone;
                realmLevelDisplay.textContent = state.realmIndex + 1;
                hpDisplay.textContent = `${Math.floor(state.player.hp)}/${state.player.maxHp}`;
                atkDisplay.textContent = state.player.attack;
                defDisplay.textContent = state.player.defense;

                // 无限征途
                const infiniteArea = document.getElementById('infiniteArea');
                if (state.realmIndex >= REALMS.length - 1) {
                    if (!infiniteArea) {
                        const area = document.createElement('div');
                        area.id = 'infiniteArea';
                        area.className = 'infinite-area';
                        area.innerHTML = `
                                <div class="title">🌌 无限征途</div>
                                <div class="info">探索无尽虚空，挑战随机BOSS，获取海量奖励与法宝</div>
                                <button class="btn-infinite" id="infiniteBtn">🚀 进入征途</button>
                            `;
                        document.getElementById('panel-map').appendChild(area);
                        document.getElementById('infiniteBtn').addEventListener('click', startInfinite);
                    }
                } else {
                    if (infiniteArea) infiniteArea.remove();
                }

                updateBreakthroughUI();
                updateSaveInfo();
            }

            function renderAll() {
                renderSkills();
                renderRegions();
                renderEquip();
                renderPets();
                renderArtifacts();
                updateUI();
            }

            // ========== 游戏循环 ==========
            function gameLoop() {
                requestAnimationFrame(gameLoop);
            }

            // ========== 事件绑定 ==========
            cultivateBtn.addEventListener('click', cultivate);
            cultivateBtn.addEventListener('touchstart', (e) => { e.preventDefault();
                cultivate(); }, { passive: false });

            exploreBtn.addEventListener('click', explore);
            battleBtn.addEventListener('click', challengeMonster);
            bossBtn.addEventListener('click', challengeBoss);

            breakthroughBtn.addEventListener('click', attemptBreakthrough);
            forcedBreakthroughBtn.addEventListener('click', forcedBreakthrough);
            extremeBreakthroughBtn.addEventListener('click', extremeBreakthrough);

            batchDecomposeBtn.addEventListener('click', batchDecompose);

            saveBtn.addEventListener('click', function() {
                saveGame(true);
            });
            loadBtn.addEventListener('click', function() {
                if (loadGame()) {
                    renderAll();
                    updateUI();
                }
            });

            regionSelect.addEventListener('change', function() {
                const idx = parseInt(this.value);
                const region = REGIONS[idx];
                if (!canEnterRegion(region)) {
                    alert(`属性不足，无法进入 ${region.name}！`);
                    this.value = state.currentRegion;
                    return;
                }
                state.currentRegion = idx;
                renderRegions();
                addLog(`切换到 ${REGIONS[idx].name}`);
                saveGame();
            });

            resetBtn.addEventListener('click', resetGame);

            // ========== 初始化 ==========
            function init() {
                const loaded = loadGame();
                initRealmProgress(state.realmIndex);
                recalcPlayerStats();
                checkSubRealm();
                checkBreakthrough();
                renderAll();
                updateUI();
                if (!loaded) {
                    saveGame(false);
                }
                gameLoop();
                addLog('🌿 灵境仙途 · 星级合成·小境界提升');
                console.log('🌿 灵境仙途 启动！');
            }

            init();

        })();
    </script>
</body>
</html>
